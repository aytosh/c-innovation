# Temporary preview. Does not replace the default site.
server {
    server_name cinnovation.130.61.169.93.sslip.io;

    client_max_body_size 8m;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    location /_next/static/ {
        alias /var/www/cinnovation/.next/static/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /logos/ {
        alias /var/www/cinnovation/public/logos/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        set $cin_skip 0;
        if ($request_method != GET) {
            set $cin_skip 1;
        }
        if ($http_rsc != "") {
            set $cin_skip 1;
        }
        if ($http_next_router_prefetch != "") {
            set $cin_skip 1;
        }
        if ($http_next_router_segment_prefetch != "") {
            set $cin_skip 1;
        }

        proxy_pass http://cinnovation_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;

        proxy_cache cinnovation;
        proxy_cache_key $scheme$host$request_uri;
        proxy_ignore_headers Cache-Control;
        proxy_cache_valid 200 30s;
        proxy_cache_bypass $cin_skip;
        proxy_no_cache $cin_skip;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cinnovation.130.61.169.93.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cinnovation.130.61.169.93.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = cinnovation.130.61.169.93.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name cinnovation.130.61.169.93.sslip.io;
    return 404; # managed by Certbot
}
